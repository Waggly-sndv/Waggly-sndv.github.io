<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesús Gael Sandoval Rosas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink: #1b2a2f;
    --paper: #eef2ef;
    --line: #c7d0cb;
    --accent: #2f6f5e;
    --accent-soft: #dce7e1;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }

  .card{
    width:100%;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow:hidden;
    box-shadow: 0 1px 0 var(--line);
  }

  .card__band{
    background: var(--accent);
    height: 8px;
    width:100%;
  }

  .card__body{
    padding: 40px 36px 36px;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
  }

  .name{
    font-size: 32px;
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }

  .field{
    display:flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }

  .field:last-child{
    border-bottom: 1px solid var(--line);
  }

  .field__label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #6b7b76;
    min-width: 96px;
  }

  .field__value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 3px;
  }

  .field__value--link{
    text-decoration: none;
    color: var(--ink);
  }

  .field__value--link:hover{
    color: var(--accent);
  }

  .footer-note{
    margin-top: 28px;
    font-size: 12px;
    color: #8c9995;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{
      animation: rise 0.5s ease-out;
    }
    @keyframes rise{
      from{ opacity:0; transform: translateY(8px); }
      to{ opacity:1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card__band"></div>
    <div class="card__body">
      <p class="eyebrow">Ficha personal</p>
      <h1 class="name">Jesús Gael<br>Sandoval Rosas</h1>

      <div class="field">
        <span class="field__label">Nombre</span>
        <span class="field__value">Jesús Gael Sandoval Rosas</span>
      </div>
      <div class="field">
        <span class="field__label">Matrícula</span>
        <span class="field__value">S26004661</span>
      </div>
      <div class="field">
        <span class="field__label">GitHub</span>
        <a class="field__value field__value--link" href="https://github.com/Waggly-sndv" target="_blank" rel="noopener">@Waggly-sndv</a>
      </div>

      <p class="footer-note"> correo: dukygael@gmail.com </p>
    </div>
  </div>

</body>
</html>
